<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Now</title>
<meta name="description" content="The day's important news, every morning in one place.">
<meta name="theme-color" content="#0a0c11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-mark">DN</div>
  <div class="boot-text">Daily Now</div>
</div>

<div class="app" id="app" hidden>

  <!-- ───────────────────────── Sidebar ───────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">DN</div>
      <div class="brand-text">
        <strong>Daily Now</strong>
        <span id="brandDate">—</span>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item is-active" data-view="feed">
        <svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h10M4 15h16M4 20h10"/></svg>
        <span data-i18n="nav.feed">Feed</span>
        <em class="nav-badge" id="badgeUnread" hidden>0</em>
      </button>
    </nav>

    <div class="side-section" id="sideTags">
      <div class="side-title" data-i18n="side.tags">Tags</div>
      <div class="chip-list" id="tagChips"></div>
    </div>
  </aside>

  <!-- ───────────────────────── Main ───────────────────────── -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btnMenu" aria-label="Menu" data-i18n-aria="a11y.menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <div class="search-wrap">
        <svg class="search-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
        <input id="globalSearch" type="search" placeholder="Search the news — headline, source, tag, full text…" data-i18n-placeholder="search.placeholder" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>

      <div class="topbar-actions">
        <div class="lang-switch" id="langSwitch" role="group" aria-label="Language" data-i18n-aria="a11y.language"></div>
        <button class="icon-btn" id="btnTheme" title="Theme" data-i18n-title="a11y.theme">
          <svg viewBox="0 0 24 24" class="ico-moon"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
          <svg viewBox="0 0 24 24" class="ico-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </button>
      </div>
    </header>

    <div class="views" id="views">

      <!-- ── Akış ── -->
      <section class="view is-active" data-view="feed">
        <div class="view-head">
          <div>
            <h1 id="feedTitle">Today’s agenda</h1>
            <p class="sub" id="feedSub">—</p>
          </div>
          <div class="seg" id="feedRange">
            <button data-range="today" class="is-active" data-i18n="range.today">Today</button>
            <button data-range="7" data-i18n="range.7">7 days</button>
            <button data-range="30" data-i18n="range.30">30 days</button>
            <button data-range="all" data-i18n="range.all">All</button>
          </div>
        </div>

        <div class="filter-row" id="filterRow">
          <button class="pill" data-filter="unread" data-i18n="filter.unread">Unread</button>
          <button class="pill" data-filter="starred" data-i18n="filter.starred">Starred</button>
          <div class="active-filters" id="activeFilters"></div>
        </div>

        <!-- Akış = kategori seçim ekranı. Haberler kategori sayfasında okunur. -->
        <div class="cat-cards" id="feedCats"></div>

        <div id="feedBody"></div>
      </section>

      <!-- ── Arama ── -->
      <section class="view" data-view="search">
        <div class="view-head">
          <div>
            <h1 data-i18n="search.title">Search</h1>
            <p class="sub" id="searchSub" data-i18n="search.sub">Searches headlines, sources, tags, summaries and full text.</p>
          </div>
        </div>
        <div id="searchBody"></div>
      </section>

    </div>
  </main>

  <!-- Mobil alt gezinme -->
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- ───────────────────────── Reader ───────────────────────── -->
<div class="reader" id="reader" hidden>
  <header class="reader-bar">
    <button class="icon-btn" id="rdClose" aria-label="Close" data-i18n-aria="a11y.close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="reader-meta">
      <strong id="rdTitle">—</strong>
      <span id="rdSub">—</span>
    </div>
    <div class="reader-tools">
      <div class="pager">
        <button class="icon-btn" id="rdPrev" aria-label="Previous page" data-i18n-aria="a11y.prevPage"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span><input id="rdPageInput" type="text" inputmode="numeric" value="1"> / <b id="rdPages">1</b></span>
        <button class="icon-btn" id="rdNext" aria-label="Next page" data-i18n-aria="a11y.nextPage"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <button class="icon-btn" id="rdZoomOut" aria-label="Zoom out" data-i18n-aria="a11y.zoomOut"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M20 20l-4.5-4.5"/></svg></button>
      <button class="icon-btn" id="rdZoomIn" aria-label="Zoom in" data-i18n-aria="a11y.zoomIn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M11 8v6M20 20l-4.5-4.5"/></svg></button>
      <button class="icon-btn" id="rdStar" aria-label="Star" data-i18n-aria="a11y.star"><svg viewBox="0 0 24 24"><path d="m12 3.6 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9Z"/></svg></button>
      <a class="icon-btn" id="rdDownload" download aria-label="Download" data-i18n-aria="a11y.download"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/></svg></a>
    </div>
  </header>
  <div class="reader-body" id="rdBody">
    <div class="reader-canvas-wrap" id="rdCanvasWrap"></div>
  </div>
</div>

<!-- ───────────────────────── Overlays ───────────────────────── -->
<!-- ───────────────────── Kategori sayfası (popup) ───────────────────── -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-scrim" data-sheet-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header class="sheet-head">
      <div class="sheet-id">
        <span class="sheet-kicker" id="sheetKicker">—</span>
        <h2 id="sheetTitle">—</h2>
        <p id="sheetSub">—</p>
      </div>
      <button class="icon-btn" data-sheet-close aria-label="Close" data-i18n-aria="a11y.close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="toasts" id="toasts"></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
